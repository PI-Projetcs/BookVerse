spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:bookverse;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 1025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enabled: false

bookverse:
  jwt:
    secret: test-jwt-secret-change-me-32-chars-min-required-test
    expiration-ms: 3600000
